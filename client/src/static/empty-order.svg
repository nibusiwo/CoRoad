<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <!-- Receipt/Document body -->
  <rect x="40" y="20" width="120" height="110" rx="4" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1.5"/>
  <!-- Fold corner -->
  <path d="M120 20 L120 35 L136 35 L135 21" fill="#E8E8E8" stroke="#E0E0E0" stroke-width="1"/>
  <!-- Receipt lines -->
  <rect x="55" y="45" width="90" height="4" rx="2" fill="#E0E0E0"/>
  <rect x="55" y="58" width="70" height="3" rx="1.5" fill="#E8E8E8"/>
  <rect x="55" y="68" width="80" height="3" rx="1.5" fill="#E8E8E8"/>
  <rect x="55" y="78" width="60" height="3" rx="1.5" fill="#E8E8E8"/>
  <rect x="55" y="88" width="75" height="3" rx="1.5" fill="#E8E8E8"/>
  <!-- Separator line -->
  <line x1="55" y1="100" x2="145" y2="100" stroke="#E0E0E0" stroke-width="0.5"/>
  <!-- Total line -->
  <rect x="55" y="108" width="50" height="4" rx="2" fill="#D0D0D0"/>
  <rect x="120" y="108" width="25" height="4" rx="2" fill="#D0D0D0"/>
  <!-- Big X mark -->
  <line x1="70" y1="40" x2="130" y2="100" stroke="#BDBDBD" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <line x1="130" y1="40" x2="70" y2="100" stroke="#BDBDBD" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <!-- Text -->
  <text x="100" y="145" font-family="'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="12" fill="#BDBDBD" text-anchor="middle">暂无订单</text>
</svg>
