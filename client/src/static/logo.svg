<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <!-- Road curves -->
  <path d="M10 45 Q40 20 80 45 Q120 70 160 35 Q180 20 190 30"
        fill="none" stroke="#07C160" stroke-width="4" stroke-linecap="round"/>
  <!-- Road dashed center line -->
  <path d="M10 45 Q40 20 80 45 Q120 70 160 35 Q180 20 190 30"
        fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
  <!-- Location pin -->
  <circle cx="80" cy="37" r="3" fill="#07C160"/>
  <circle cx="160" cy="27" r="3" fill="#07C160"/>
  <!-- Start dot -->
  <circle cx="12" cy="45" r="3.5" fill="#07C160"/>
  <!-- "同道" text -->
  <text x="100" y="22" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="18" font-weight="700" fill="#07C160" text-anchor="middle"
        letter-spacing="4">同道</text>
  <!-- CoRoad text -->
  <text x="100" y="34" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="9" font-weight="500" fill="#07C160" text-anchor="middle"
        letter-spacing="2" opacity="0.7">CoRoad</text>
</svg>
