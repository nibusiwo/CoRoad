<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <!-- Ticket body -->
  <rect x="45" y="30" width="110" height="80" rx="3" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1.5"/>
  <!-- Left circle cutout -->
  <circle cx="45" cy="55" r="6" fill="#fff" stroke="#E0E0E0" stroke-width="1.5"/>
  <circle cx="45" cy="85" r="6" fill="#fff" stroke="#E0E0E0" stroke-width="1.5"/>
  <!-- Right circle cutout -->
  <circle cx="155" cy="55" r="6" fill="#fff" stroke="#E0E0E0" stroke-width="1.5"/>
  <circle cx="155" cy="85" r="6" fill="#fff" stroke="#E0E0E0" stroke-width="1.5"/>
  <!-- Dashed perforation line -->
  <line x1="100" y1="36" x2="100" y2="104" stroke="#D0D0D0" stroke-width="1" stroke-dasharray="2 3"/>
  <!-- Left side: % symbol -->
  <text x="72" y="62" font-family="'PingFang SC',sans-serif"
        font-size="24" font-weight="700" fill="#D0D0D0" text-anchor="middle">%</text>
  <text x="72" y="82" font-family="'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="8" fill="#D0D0D0" text-anchor="middle">优惠券</text>
  <!-- Right side: price placeholder -->
  <rect x="115" y="50" width="30" height="8" rx="2" fill="#E8E8E8"/>
  <rect x="115" y="65" width="22" height="4" rx="1.5" fill="#E8E8E8"/>
  <!-- Slash across ticket -->
  <line x1="55" y1="35" x2="145" y2="105" stroke="#BDBDBD" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <!-- Text -->
  <text x="100" y="145" font-family="'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="12" fill="#BDBDBD" text-anchor="middle">暂无优惠券</text>
</svg>
